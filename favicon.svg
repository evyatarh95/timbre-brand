  <g clip-path="url(#fbClip)">
    <rect width="64" height="64" fill="#05050a"/>
    <rect width="64" height="64" fill="url(#fbTR)"/>
    <rect width="64" height="64" fill="url(#fbBL)"/>
    <rect width="64" height="64" filter="url(#fbGrain)"/>
  </g>
  <rect x="15" y="16.5" width="34" height="9.5" rx="2.5" fill="url(#fbT)"/>
  <rect x="27.25" y="16.5" width="9.5" height="32" rx="2.5" fill="url(#fbT)"/>
</svg>
