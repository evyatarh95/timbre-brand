<svg viewBox="0 0 380 320" xmlns="http://www.w3.org/2000/svg" width="380" height="320">
  <defs>
    <linearGradient id="g21" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FF3D7F"/><stop offset="0.5" stop-color="#FF5A2B"/><stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
  </defs>
  <!-- isometric 3D T : front + back(depth) + connectors -->
  <g fill="none" stroke="url(#g21)" stroke-linejoin="round" stroke-linecap="round">
    <!-- back (depth) face, offset up-right -->
    <polygon points="166,52 254,52 254,72 226,72 226,156 194,156 194,72 166,72" stroke-width="2.4" opacity="0.85"/>
    <!-- connectors between front and back vertices (visible top + right edges) -->
    <g stroke-width="2.4" opacity="0.85">
      <line x1="146" y1="64" x2="166" y2="52"/>
      <line x1="234" y1="64" x2="254" y2="52"/>
      <line x1="234" y1="84" x2="254" y2="72"/>
      <line x1="206" y1="84" x2="226" y2="72"/>
      <line x1="206" y1="168" x2="226" y2="156"/>
      <line x1="174" y1="168" x2="194" y2="156"/>
    </g>
    <!-- front face of the T -->
    <polygon points="146,64 234,64 234,84 206,84 206,168 174,168 174,84 146,84" stroke-width="3.4"/>
  </g>
  <!-- wordmark : clean sans, wide tracking -->
  <text x="190" y="248" text-anchor="middle" font-family="'Jost',sans-serif" font-weight="400" font-size="34" letter-spacing="18" fill="#fafafa">TIMBR</text>
</svg>
