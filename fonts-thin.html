<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIMBR — Thin Geometric</title><link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300&family=Montserrat:wght@300&family=Outfit:wght@300&family=Poppins:wght@300&family=Raleway:wght@300&family=Questrial&family=Josefin+Sans:wght@300&family=Gruppo&family=League+Spartan:wght@300&family=Didact+Gothic&family=Nunito+Sans:wght@300&family=Kanit:wght@200&family=Playfair+Display:wght@600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#08080b;color:#fafafa;font-family:'JetBrains Mono',monospace;padding:40px 24px 90px}
.head{text-align:center}.head h1{font-family:'Playfair Display',serif;font-weight:600;font-size:36px;letter-spacing:.06em}
.head h1 .g{background:linear-gradient(90deg,#ff2f6d,#ff8a1f);-webkit-background-clip:text;background-clip:text;color:transparent}
.head p{font-size:12px;color:#8a8a93;margin-top:8px;letter-spacing:.1em}
.bar{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:20px 0 30px}
.bar a{font-size:12px;text-decoration:none;padding:7px 16px;border:1px solid rgba(255,255,255,.15);border-radius:99px;color:#fafafa}
.bar a.on{border-color:#FF6A00;color:#FF6A00}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:1240px;margin:0 auto}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
.card{position:relative;background:#000;border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;aspect-ratio:1.05}
.card img{width:100%;height:100%;object-fit:contain}.card .no{position:absolute;top:9px;left:11px;font-size:9px;color:#8a8a93;letter-spacing:.08em;z-index:2}
</style></head><body>
<div class="head"><h1>TIM<span class="g">BR</span> — Thin Geometric</h1><p>light geometric sans · wide spacing (matching your reference)</p></div>
<div class="bar"><a href="final.html">FINAL</a><a href="fonts.html">SERIF FONTS</a><a href="fonts-thin.html" class="on">THIN SANS</a></div>
<div class="grid">
<div class="card"><span class="no"></span><img src="timbr-thin-.svg"></div>
<div class="card"><span class="no">Jost Light</span><img src="timbr-thin-jost.svg"></div>
<div class="card"><span class="no">Montserrat Light</span><img src="timbr-thin-montserrat.svg"></div>
<div class="card"><span class="no">Outfit Light</span><img src="timbr-thin-outfit.svg"></div>
<div class="card"><span class="no">Poppins Light</span><img src="timbr-thin-poppins.svg"></div>
<div class="card"><span class="no">Raleway Light</span><img src="timbr-thin-raleway.svg"></div>
<div class="card"><span class="no">Questrial</span><img src="timbr-thin-questrial.svg"></div>
<div class="card"><span class="no">Josefin Light</span><img src="timbr-thin-josefin.svg"></div>
<div class="card"><span class="no">Gruppo</span><img src="timbr-thin-gruppo.svg"></div>
<div class="card"><span class="no">League Spartan</span><img src="timbr-thin-spartan.svg"></div>
<div class="card"><span class="no">Didact Gothic</span><img src="timbr-thin-didact.svg"></div>
<div class="card"><span class="no">Nunito Sans</span><img src="timbr-thin-nunito.svg"></div>
</div></body></html>
