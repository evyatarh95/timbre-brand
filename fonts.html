<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIMBR — Beautiful Fonts</title><link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Cinzel:wght@600&family=Bodoni+Moda:wght@600&family=Prata&family=Italiana&family=Marcellus&family=DM+Serif+Display&family=Forum&family=Gilda+Display&family=Cardo:wght@700&family=EB+Garamond:wght@600&family=Spectral:wght@600&family=Libre+Caslon+Display&family=Fraunces:wght@500&family=Bellefair&family=Cormorant+SC:wght@600&family=Playfair+Display+SC:wght@600&family=Tenor+Sans&family=Josefin+Sans:wght@500&family=Jost:wght@300&family=Playfair+Display:wght@600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#08080b;color:#fafafa;font-family:'JetBrains Mono',monospace;padding:40px 24px 90px}
.head{text-align:center}.head h1{font-family:'Playfair Display',serif;font-weight:600;font-size:38px;letter-spacing:.06em}
.head h1 .g{background:linear-gradient(90deg,#ff2f6d,#ff8a1f);-webkit-background-clip:text;background-clip:text;color:transparent}
.head p{font-size:12px;color:#8a8a93;margin-top:8px;letter-spacing:.1em}
.bar{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:20px 0 30px}
.bar a{font-size:12px;text-decoration:none;padding:7px 16px;border:1px solid rgba(255,255,255,.15);border-radius:99px;color:#fafafa}
.bar a.on{border-color:#FF6A00;color:#FF6A00}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:1280px;margin:0 auto}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
.card{position:relative;background:#000;border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;aspect-ratio:1}
.card img{width:100%;height:100%;object-fit:contain}.card .no{position:absolute;top:9px;left:11px;font-size:9px;color:#8a8a93;letter-spacing:.08em;z-index:2}
</style></head><body>
<div class="head"><h1>TIM<span class="g">BR</span> — Beautiful Fonts</h1><p>20 elegant / premium wordmark options</p></div>
