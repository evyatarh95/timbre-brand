<svg viewBox="0 0 2000 2000" xmlns="http://www.w3.org/2000/svg" width="2000" height="2000">
  <defs>
    <linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="670" y1="0" x2="1330" y2="0">
      <stop offset="0" stop-color="#ff2f6d"/>
      <stop offset="0.38" stop-color="#ff5a3d"/>
      <stop offset="0.70" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
  </defs>

  <rect width="2000" height="2000" fill="#000000"/>

  <!-- ===== isometric 3D letter T : three outline faces, no fill ===== -->
  <g fill="none" stroke="url(#tg)" stroke-width="26" stroke-linejoin="round" stroke-linecap="round">
    <!-- top face (open at center: no horizontal line between the stems) -->
    <polyline points="670,570 1000,390 1330,570"/>
    <!-- left vertical face -->
    <polygon points="670,570 670,720 820,805 820,1060 965,1130 965,720"/>
    <!-- right vertical face -->
    <polygon points="1330,570 1330,720 1180,805 1180,1060 1035,1130 1035,720"/>
  </g>

  <!-- ===== wordmark : luxury high-contrast serif ===== -->
  <text x="1000" y="1450" text-anchor="middle"
        font-family="'Playfair Display', Didot, 'Bodoni 72', serif"
        font-weight="500" font-size="200" letter-spacing="78" fill="#ffffff"
        dx="39">TIMBR</text>
</svg>
