<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#000;color:#fafafa;font-family:'Jost',sans-serif;padding:54px 26px 90px;}
.head{text-align:center;max-width:760px;margin:0 auto 14px;}
.wavemark{display:flex;gap:3px;justify-content:center;align-items:flex-end;height:30px;margin-bottom:14px;}
.wavemark i{width:2.5px;border-radius:2px;background:linear-gradient(#FF3D7F,#FF8A1F);display:block;}
.head h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:64px;letter-spacing:.22em;text-indent:.22em;line-height:1;}
.head .sub{font-family:'Jost',sans-serif;font-weight:300;font-size:13px;letter-spacing:.42em;text-indent:.42em;color:#cfcfd6;margin:16px 0 14px;text-transform:uppercase;}
.rule{height:1px;width:340px;max-width:80%;margin:0 auto;background:linear-gradient(90deg,transparent,#FF5A2B,transparent);}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:1080px;margin:40px auto 0;}
@media(max-width:680px){.grid{grid-template-columns:1fr;}}
.card{position:relative;background:#000;border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:30px 24px;display:flex;align-items:center;justify-content:center;min-height:250px;transition:border-color .2s;}
.card:hover{border-color:rgba(255,90,43,.5);}
.card .no{position:absolute;top:12px;left:14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#6a6a73;}
.card svg.logo{width:100%;height:auto;max-height:220px;}
.foot{text-align:center;margin-top:48px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#5a5a63;letter-spacing:.1em;}
.foot a{color:#FF6A00;text-decoration:none;}
</style></head><body>
